services:
  postgres:
    image: postgres:16-alpine
    container_name: streaming-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: StreamingProject.Web/Dockerfile
    container_name: streaming-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__StreamingDbContext: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      JwtOptions__SecretKey: ${JWT_SECRET_KEY}
      JwtOptions__Audience: streaming-project
      JwtOptions__Issuer: streaming-project
      JwtOptions__ExpireHours: 12
    ports:
      - "5228:8080"
      - "1935:1935"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./streaming-ui
      dockerfile: Dockerfile
    container_name: streaming-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres-data: