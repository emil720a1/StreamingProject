<section class="streams-page">
  <div class="page-header">
    <div>
      <p class="eyebrow">Browse</p>
      <h1>Live streams</h1>
      <p>Discover streams from different categories.</p>
    </div>
  </div>

  <div class="stream-grid">
    @for (stream of streams; track stream.id) {
      <article class="stream-card">
        <div class="stream-preview">
          <span [class.live]="stream.isLive">
            {{ stream.isLive ? 'LIVE' : 'OFFLINE' }}
          </span>
        </div>

        <div class="stream-info">
          <h2>{{ stream.title }}</h2>
          <p>{{ stream.author }}</p>
          <span>
            {{ stream.category }} · {{ stream.viewers }} viewers
          </span>

          <a [routerLink]="['/streams', stream.id]">
            Open stream
          </a>
        </div>
      </article>
    }
  </div>
</section>
