<article class="stream-card">
  <div class="stream-preview">
    @if (stream.thumbnailUrl) {
      <img [src]="stream.thumbnailUrl" [alt]="stream.title" />
    }
    <span class="live">LIVE</span>
  </div>

  <div class="stream-info">
    <h2>{{ stream.title }}</h2>

    <p>
      {{ stream.streamerUsername ?? 'Unknown streamer' }}
    </p>

    <span>
      {{ stream.description }}
    </span>

    <span>{{ stream.category }} · {{ stream.viewerCount }} viewers</span>

    @if (stream.startTime) {
      <time [attr.datetime]="stream.startTime">
        Started: {{ stream.startTime }}
      </time>
    }

    <a [routerLink]="['/streams', stream.id]">
      Open stream
    </a>
  </div>
</article>
