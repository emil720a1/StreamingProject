name: Observability

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  contents: read

env:
  POSTGRES_DB: streaming
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ci-postgres-password
  JWT_SECRET_KEY: ci-jwt-secret-key-that-is-long-enough
  GRAFANA_ADMIN_USER: admin
  GRAFANA_ADMIN_PASSWORD: ci-grafana-password

jobs:
  validate:
    name: Validate observability configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install YAML parser
        run: python3 -m pip install --disable-pip-version-check --user PyYAML

      - name: Validate YAML configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          files = [
              Path("docker-compose.yml"),
              Path("deploy/observability/loki/loki-config.yaml"),
              Path("deploy/observability/prometheus/prometheus.yaml"),
              Path("deploy/observability/grafana/provisioning/dashboards/providers.yaml"),
              Path("deploy/observability/grafana/provisioning/datasources/datasources.yaml"),
          ]

          for path in files:
              with path.open(encoding="utf-8") as file:
                  yaml.safe_load(file)
              print(f"Valid YAML: {path}")
          PY

      - name: Validate dashboard JSON
        run: |
          python3 -m json.tool \
            deploy/observability/grafana/dashboards/streamingproject-overview.json \
            > /dev/null
          echo "Valid JSON: deploy/observability/grafana/dashboards/streamingproject-overview.json"

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Validate Prometheus configuration
        run: |
          docker run --rm \
            -v "$PWD/deploy/observability/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool \
            prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yaml

      - name: Validate Prometheus alert rules
        run: |
          docker run --rm \
            -v "$PWD/deploy/observability/prometheus/rules:/etc/prometheus/rules:ro" \
            --entrypoint promtool \
            prom/prometheus:v3.5.0 \
            check rules /etc/prometheus/rules/streamingproject-alerts.yaml

      - name: Start observability services
        run: docker compose up -d prometheus loki grafana

      - name: Wait for services to become ready
        run: |
          set -euo pipefail

          wait_for() {
            local name="$1"
            local url="$2"

            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error "$url" > /dev/null; then
                echo "$name is ready"
                return 0
              fi

              sleep 2
            done

            echo "$name did not become ready: $url" >&2
            return 1
          }

          wait_for "Prometheus" "http://localhost:9090/-/ready"
          wait_for "Loki" "http://localhost:3100/ready"
          wait_for "Grafana" "http://localhost:3000/api/health"

      - name: Verify Grafana provisioning
        run: |
          docker compose logs --no-color grafana | tee grafana.log
          grep -q "finished to provision dashboards" grafana.log

          curl --fail --silent --show-error \
            --user "$GRAFANA_ADMIN_USER:$GRAFANA_ADMIN_PASSWORD" \
            http://localhost:3000/api/datasources/uid/prometheus \
            > /dev/null

          curl --fail --silent --show-error \
            --user "$GRAFANA_ADMIN_USER:$GRAFANA_ADMIN_PASSWORD" \
            http://localhost:3000/api/datasources/uid/loki \
            > /dev/null

          curl --fail --silent --show-error \
            --user "$GRAFANA_ADMIN_USER:$GRAFANA_ADMIN_PASSWORD" \
            http://localhost:3000/api/dashboards/uid/streamingproject-overview \
            > /dev/null

          echo "Grafana datasources and dashboard are provisioned"

      - name: Show service logs on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color prometheus loki grafana

      - name: Stop observability services
        if: always()
        run: docker compose down -v
